name: Missing color coverage
description: Request an unmapped VS Code, language, or extension color token.
title: "feat: add color coverage for "
labels:
  - enhancement
body:
  - type: textarea
    id: missing-coverage
    attributes:
      label: Missing coverage
      description: Name the UI element, token, language scope, or extension contribution.
    validations:
      required: true
  - type: dropdown
    id: theme-variant
    attributes:
      label: Theme variant
      options:
        - Everforest Complete Dark Soft
        - Everforest Complete Dark Medium
        - Everforest Complete Dark Hard
        - Everforest Complete Light Soft
        - Everforest Complete Light Medium
        - Everforest Complete Light Hard
        - Everforest Complete Dark
        - Everforest Complete Light
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Everforest Complete version
      description: Give the exact installed extension version.
      placeholder: "X.Y.Z"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "1.96.0"
    validations:
      required: true
  - type: textarea
    id: everforest-settings
    attributes:
      label: Everforest settings
      description:
        Paste only changed `everforestComplete.*` settings (application-scoped/global). Optionally
        add sanitised native `window.*`/`workbench.*` settings or workspace/folder override context.
        Remove private data.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot and context
      description:
        Attach a sanitised screenshot and include the language mode or extension name. Remove source
        code, paths, usernames, tokens, and other private data first.
    validations:
      required: true
