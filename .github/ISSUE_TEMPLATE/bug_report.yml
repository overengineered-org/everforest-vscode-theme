name: Theme defect
description: Report a reproducible problem in an existing theme mapping.
title: "fix: "
labels:
  - bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest steps that show the problem.
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Everforest Complete version
      description: Give the exact installed extension version.
      placeholder: "X.Y.Z"
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: "1.96.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Desktop
        - Remote window
        - Browser-hosted VS Code
    validations:
      required: true
  - type: dropdown
    id: theme-variant
    attributes:
      label: Theme variant
      options:
        - Everforest Complete Dark Soft
        - Everforest Complete Dark Medium
        - Everforest Complete Dark Hard
        - Everforest Complete Light Soft
        - Everforest Complete Light Medium
        - Everforest Complete Light Hard
        - Everforest Complete Dark
        - Everforest Complete Light
    validations:
      required: true
  - type: textarea
    id: everforest-settings
    attributes:
      label: Everforest settings
      description:
        Paste only changed `everforestComplete.*` settings (application-scoped/global). Optionally
        add sanitised native `window.*`/`workbench.*` settings or workspace/folder override context.
        Remove private data.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or recording
      description:
        Drag an image or recording here when possible. Remove source code, paths, usernames, tokens,
        and other private data first.
