name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Newer pull-request commits supersede all checks for that pull request. Main
# runs are retained so a release can only follow the exact commit it validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static validation and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Package VSIX
        run: npm run package:vsix
      - name: Verify VSIX contents
        run: npm run package:verify
      - name: Upload validated VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: validated-vsix
          path: dist/everforest-complete.vsix
          retention-days: 1
      - name: Verify release package and checksum
        run: npm run test:release-package
      - name: Audit production dependencies
        run: npm run audit:production

  integration:
    name: Extension Host (${{ matrix.operating-system }}, VS Code ${{ matrix.vscode-version }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: ubuntu-latest
            vscode-version: stable
          - operating-system: macos-latest
            vscode-version: stable
          - operating-system: windows-latest
            vscode-version: stable
          - operating-system: ubuntu-latest
            vscode-version: 1.95.3
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Download validated VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-vsix
          path: dist
      - name: Test in VS Code on Linux
        if: runner.os == 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run --auto-servernum npm run test:integration:vsix
      - name: Test in VS Code
        if: runner.os != 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: npm run test:integration:vsix

  tests-summary:
    name: Tests
    if: always()
    needs:
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all test jobs to pass
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [[ "$INTEGRATION_RESULT" != success ]]; then
            echo "Tests failed: integration=$INTEGRATION_RESULT" >&2
            exit 1
          fi

  pull-request-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pull-request-title.mjs

  release-dry-run:
    name: Semantic release dry run
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Evaluate merged pull request without publishing
        # Mirror the hypothetical merge on main. Dry-run mode disables tags,
        # pushes, package creation, and GitHub publication.
        run: |
          git switch --force-create main
          git branch --set-upstream-to=origin/main main
          npm run release -- --dry-run --no-git.push --no-github.release

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static
      - tests-summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release-tag: ${{ steps.resolve-release.outputs.tag }}
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git switch --force-create main
          git branch --set-upstream-to=origin/main main
          git config user.name "Repository Maintainer"
          git config user.email "repository-maintainer@overengineered.invalid"
          npm run release
      - name: Resolve released version
        id: resolve-release
        run: |
          git fetch --tags origin
          release_tag="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  marketplace:
    name: Visual Studio Marketplace
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release.outputs.release-tag != ''
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace-production
    permissions:
      contents: read
    concurrency:
      group: marketplace-production
      cancel-in-progress: false
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Download and verify GitHub Release package
        id: release-package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.release-tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_asset_directory="$RUNNER_TEMP/marketplace-release"
          mkdir -p "$release_asset_directory"
          gh release download "$RELEASE_TAG" \
            --dir "$release_asset_directory" \
            --pattern "$release_package_name" \
            --pattern "$release_checksum_name"
          (cd "$release_asset_directory" && sha256sum --check "$release_checksum_name")
          echo "path=${release_asset_directory}/${release_package_name}" >> "$GITHUB_OUTPUT"
      - name: Publish exact release package
        env:
          RELEASE_PACKAGE_PATH: ${{ steps.release-package.outputs.path }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          npx --no-install vsce publish --packagePath "$RELEASE_PACKAGE_PATH" --skip-duplicate
