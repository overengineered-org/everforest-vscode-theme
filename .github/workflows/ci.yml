name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Newer pull-request commits supersede all checks for that pull request. Main
# runs are retained so a release can only follow the exact commit it validated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static validation and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Package VSIX
        run: npm run package:vsix
      - name: Verify VSIX contents
        run: npm run package:verify
      - name: Verify release package and checksum
        run: npm run test:release-package
      - name: Audit production dependencies
        run: npm run audit:production

  integration:
    name: Extension Host (${{ matrix.operating-system }}, VS Code ${{ matrix.vscode-version }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: ubuntu-latest
            vscode-version: stable
          - operating-system: macos-latest
            vscode-version: stable
          - operating-system: windows-latest
            vscode-version: stable
          - operating-system: ubuntu-latest
            vscode-version: 1.95.3
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Test in VS Code on Linux
        if: runner.os == 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Test in VS Code
        if: runner.os != 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: npm run test:integration

  tests-summary:
    name: Tests
    if: always()
    needs:
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all test jobs to pass
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [[ "$INTEGRATION_RESULT" != success ]]; then
            echo "Tests failed: integration=$INTEGRATION_RESULT" >&2
            exit 1
          fi

  pull-request-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate title
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pull-request-title.mjs

  release-dry-run:
    name: Semantic release dry run
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Evaluate merged pull request without publishing
        # Mirror the hypothetical merge to an isolated local main branch.
        # Decision-only plugins prevent package or release publication.
        run: |
          git switch --force-create main
          release_dry_run_repository="$RUNNER_TEMP/release-dry-run.git"
          git init --bare --initial-branch=main "$release_dry_run_repository"
          git push "$release_dry_run_repository" HEAD:main --tags
          GITHUB_EVENT_NAME=push GITHUB_REF=refs/heads/main \
            npm run release -- --dry-run --no-ci \
              --repository-url "file://$release_dry_run_repository" \
              --plugins @semantic-release/commit-analyzer \
              --plugins @semantic-release/release-notes-generator

  release:
    name: GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static
      - tests-summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
