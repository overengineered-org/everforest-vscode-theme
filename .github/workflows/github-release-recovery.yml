name: GitHub Release recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed Release workflow run ID that contains the validated candidate
        required: true
        type: string
      tag:
        description: Existing version tag created by the failed Release run, for example v1.2.3
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate failed Release run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.validate-source.outputs.source_commit }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate failed Release run, tag, and candidate artifact
        id: validate-source
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Source run ID must be a positive integer." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          source_run_path="repos/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}"
          source_run_json="$(gh api "$source_run_path")"
          source_run_name="$(jq -r '.name' <<<"$source_run_json")"
          source_run_path_name="$(jq -r '.path' <<<"$source_run_json")"
          source_run_event="$(jq -r '.event' <<<"$source_run_json")"
          source_run_conclusion="$(jq -r '.conclusion' <<<"$source_run_json")"
          source_run_branch="$(jq -r '.head_branch' <<<"$source_run_json")"
          source_commit_sha="$(jq -r '.head_sha' <<<"$source_run_json")"
          if [[ "$source_run_name" != "Release" ]] || \
            { [[ "$source_run_path_name" != ".github/workflows/release.yml" ]] && \
              [[ "$source_run_path_name" != ".github/workflows/release.yml@main" ]]; } || \
            [[ "$source_run_event" != "workflow_dispatch" ]] || \
            [[ "$source_run_conclusion" != "failure" ]] || \
            [[ "$source_run_branch" != "main" ]] || \
            [[ ! "$source_commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source run is not the failed Release run for main." >&2
            exit 1
          fi

          source_jobs_json="$(gh api "${source_run_path}/jobs?per_page=100")"
          release_job_count="$(jq '[.jobs[] | select(.name == "GitHub Release")] | length' <<<"$source_jobs_json")"
          release_job_conclusion="$(jq -r '[.jobs[] | select(.name == "GitHub Release") | .conclusion] | if length == 1 then .[0] else "missing-or-duplicate" end' <<<"$source_jobs_json")"
          if [[ "$release_job_count" != 1 ]] || [[ "$release_job_conclusion" != "failure" ]]; then
            echo "Source run must have exactly one failed GitHub Release job." >&2
            exit 1
          fi
          for required_job_name in "Build exact release candidate" "CodeQL" "Gitleaks"; do
            required_job_conclusion="$(jq -r --arg required_job_name "$required_job_name" '[.jobs[] | select(.name == $required_job_name) | .conclusion] | if length == 1 then .[0] else "missing-or-duplicate" end' <<<"$source_jobs_json")"
            if [[ "$required_job_conclusion" != "success" ]]; then
              echo "Source job $required_job_name did not succeed." >&2
              exit 1
            fi
          done
          integration_job_count="$(jq '[.jobs[] | select(.name | startswith("VSIX ("))] | length' <<<"$source_jobs_json")"
          integration_failure_count="$(jq '[.jobs[] | select(.name | startswith("VSIX (")) | select(.conclusion != "success")] | length' <<<"$source_jobs_json")"
          if [[ "$integration_job_count" != 4 ]] || [[ "$integration_failure_count" != 0 ]]; then
            echo "Source run must have four successful VSIX integration jobs." >&2
            exit 1
          fi

          tag_ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
          tag_object_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          tag_peel_depth=0
          while [[ "$tag_object_type" == "tag" ]]; do
            tag_peel_depth=$((tag_peel_depth + 1))
            if (( tag_peel_depth > 10 )); then
              echo "${RELEASE_TAG} has too many nested annotated tags." >&2
              exit 1
            fi
            tag_object_json="$(gh api "repos/${GH_REPO}/git/tags/${tag_object_sha}")"
            tag_object_type="$(jq -r '.object.type' <<<"$tag_object_json")"
            tag_object_sha="$(jq -r '.object.sha' <<<"$tag_object_json")"
          done
          if [[ "$tag_object_type" != "commit" ]] || [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "${RELEASE_TAG} does not resolve to a commit." >&2
            exit 1
          fi
          tag_commit_sha="$tag_object_sha"
          if [[ "$tag_commit_sha" != "$source_commit_sha" ]]; then
            echo "${RELEASE_TAG} points to ${tag_commit_sha}, expected ${source_commit_sha}." >&2
            exit 1
          fi

          candidate_artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100")"
          candidate_artifact_count="$(jq '[.artifacts[] | select(.name == "validated-vsix" and .expired == false)] | length' <<<"$candidate_artifacts_json")"
          candidate_artifact_run_id="$(jq -r '[.artifacts[] | select(.name == "validated-vsix" and .expired == false) | .workflow_run.id] | if length == 1 then .[0] else "missing-or-duplicate" end' <<<"$candidate_artifacts_json")"
          candidate_artifact_sha="$(jq -r '[.artifacts[] | select(.name == "validated-vsix" and .expired == false) | .workflow_run.head_sha] | if length == 1 then .[0] else "missing-or-duplicate" end' <<<"$candidate_artifacts_json")"
          if [[ "$candidate_artifact_count" != 1 ]] || \
            [[ "$candidate_artifact_run_id" != "$SOURCE_RUN_ID" ]] || \
            [[ "$candidate_artifact_sha" != "$source_commit_sha" ]]; then
            echo "Source run does not contain exactly one unexpired exact release candidate." >&2
            exit 1
          fi
          echo "source_commit=$source_commit_sha" >> "$GITHUB_OUTPUT"

  validate-candidate:
    name: Validate exact release candidate
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require validated source commit
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT_SHA: ${{ needs.validate-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_SOURCE_COMMIT_SHA"
          checked_out_source_commit_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_source_commit_sha" != "$EXPECTED_SOURCE_COMMIT_SHA" ]]; then
            echo "Checked out $checked_out_source_commit_sha, expected $EXPECTED_SOURCE_COMMIT_SHA." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Install lean test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download exact release candidate from failed run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: validated-vsix
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify candidate identity and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_candidate_file_count="$(find dist -maxdepth 1 -type f -exec basename {} \; | wc -l | tr -d ' ')"
          if [[ "$release_candidate_file_count" != 2 ]]; then
            echo "Release candidate must contain exactly a VSIX and checksum." >&2
            exit 1
          fi
          if [[ ! -f "dist/${release_package_name}" ]] || [[ ! -f "dist/${release_checksum_name}" ]]; then
            echo "Release candidate does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          (cd dist && sha256sum --check "$release_checksum_name")
          npm run compile
          node scripts/verify-release-package.mjs "$release_version"
          npm run package:verify

  integration:
    name: Recovered VSIX (${{ matrix.operating-system }}, VS Code ${{ matrix.vscode-version }})
    needs:
      - validate-source
      - validate-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - operating-system: ubuntu-latest
            vscode-version: stable
          - operating-system: macos-latest
            vscode-version: stable
          - operating-system: windows-latest
            vscode-version: stable
          - operating-system: ubuntu-latest
            vscode-version: 1.95.3
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require validated source commit
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT_SHA: ${{ needs.validate-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_SOURCE_COMMIT_SHA"
          checked_out_source_commit_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_source_commit_sha" != "$EXPECTED_SOURCE_COMMIT_SHA" ]]; then
            echo "Checked out $checked_out_source_commit_sha, expected $EXPECTED_SOURCE_COMMIT_SHA." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Install lean test dependencies
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Download exact recovered package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: validated-vsix
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Test recovered package on Linux
        if: runner.os == 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run --auto-servernum npm run test:integration:vsix
      - name: Test recovered package
        if: runner.os != 'Linux'
        env:
          EVERFOREST_VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: npm run test:integration:vsix

  publish:
    name: Recover GitHub Release
    needs:
      - validate-source
      - validate-candidate
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Require validated source commit
        env:
          EXPECTED_SOURCE_COMMIT_SHA: ${{ needs.validate-source.outputs.source_commit }}
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_SOURCE_COMMIT_SHA"
          checked_out_source_commit_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_source_commit_sha" != "$EXPECTED_SOURCE_COMMIT_SHA" ]]; then
            echo "Checked out $checked_out_source_commit_sha, expected $EXPECTED_SOURCE_COMMIT_SHA." >&2
            exit 1
          fi
      - name: Download exact release candidate from failed run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: validated-vsix
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Create missing immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-source.outputs.source_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_package_path="dist/${release_package_name}"
          release_checksum_path="dist/${release_checksum_name}"
          if [[ ! -f "$release_package_path" ]] || [[ ! -f "$release_checksum_path" ]]; then
            echo "Exact candidate assets for ${RELEASE_TAG} are missing." >&2
            exit 1
          fi
          (cd dist && sha256sum --check "$release_checksum_name")

          resolve_remote_tag_commit_sha() {
            local remote_tag_object_json remote_tag_object_type remote_tag_object_sha
            local remote_tag_ref_json remote_tag_peel_depth=0
            remote_tag_ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
            remote_tag_object_type="$(jq -r '.object.type' <<<"$remote_tag_ref_json")"
            remote_tag_object_sha="$(jq -r '.object.sha' <<<"$remote_tag_ref_json")"
            while [[ "$remote_tag_object_type" == "tag" ]]; do
              remote_tag_peel_depth=$((remote_tag_peel_depth + 1))
              if (( remote_tag_peel_depth > 10 )); then
                echo "${RELEASE_TAG} has too many nested annotated tags." >&2
                return 1
              fi
              remote_tag_object_json="$(gh api "repos/${GH_REPO}/git/tags/${remote_tag_object_sha}")"
              remote_tag_object_type="$(jq -r '.object.type' <<<"$remote_tag_object_json")"
              remote_tag_object_sha="$(jq -r '.object.sha' <<<"$remote_tag_object_json")"
            done
            if [[ "$remote_tag_object_type" != "commit" ]] || \
              [[ ! "$remote_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "${RELEASE_TAG} does not resolve to a commit." >&2
              return 1
            fi
            printf '%s\n' "$remote_tag_object_sha"
          }

          validate_remote_tag_target() {
            local remote_tag_commit_sha
            remote_tag_commit_sha="$(resolve_remote_tag_commit_sha)"
            if [[ "$remote_tag_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
              echo "${RELEASE_TAG} points to ${remote_tag_commit_sha}, expected ${EXPECTED_COMMIT_SHA}." >&2
              return 1
            fi
          }

          release_api_path="repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          release_response_path="$RUNNER_TEMP/release-response"
          release_error_path="$RUNNER_TEMP/release-error"
          release_exists=false
          if gh api --include "$release_api_path" >"$release_response_path" 2>"$release_error_path"; then
            release_exists=true
            echo "GitHub Release ${RELEASE_TAG} already exists; validating it without mutation."
          else
            release_http_status="$(sed -n '1s#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p' "$release_response_path")"
            if [[ "$release_http_status" != 404 ]]; then
              cat "$release_error_path" >&2
              cat "$release_response_path" >&2
              exit 1
            fi
          fi

          if [[ "$release_exists" == false ]]; then
            validate_remote_tag_target
            gh release create "$RELEASE_TAG" \
              "$release_package_path" \
              "$release_checksum_path" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
            validate_remote_tag_target
          fi

      - name: Read back exact recovered release state and assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate-source.outputs.source_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_api_path="repos/${GH_REPO}/releases/tags/${RELEASE_TAG}"
          release_tag_ref_json="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}")"
          release_tag_object_type="$(jq -r '.object.type' <<<"$release_tag_ref_json")"
          release_tag_object_sha="$(jq -r '.object.sha' <<<"$release_tag_ref_json")"
          release_tag_peel_depth=0
          while [[ "$release_tag_object_type" == "tag" ]]; do
            release_tag_peel_depth=$((release_tag_peel_depth + 1))
            if (( release_tag_peel_depth > 10 )); then
              echo "${RELEASE_TAG} has too many nested annotated tags." >&2
              exit 1
            fi
            release_tag_object_json="$(gh api "repos/${GH_REPO}/git/tags/${release_tag_object_sha}")"
            release_tag_object_type="$(jq -r '.object.type' <<<"$release_tag_object_json")"
            release_tag_object_sha="$(jq -r '.object.sha' <<<"$release_tag_object_json")"
          done
          if [[ "$release_tag_object_type" != "commit" ]] || \
            [[ ! "$release_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "${RELEASE_TAG} does not resolve to a commit." >&2
            exit 1
          fi
          release_tag_commit_sha="$release_tag_object_sha"
          if [[ "$release_tag_commit_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "${RELEASE_TAG} points to ${release_tag_commit_sha}, expected ${EXPECTED_COMMIT_SHA}." >&2
            exit 1
          fi
          release_tag_name="$(gh api "$release_api_path" --jq '.tag_name')"
          release_is_draft="$(gh api "$release_api_path" --jq '.draft')"
          release_is_prerelease="$(gh api "$release_api_path" --jq '.prerelease')"
          release_is_immutable="$(gh api "$release_api_path" --jq '.immutable')"
          release_asset_count="$(gh api "$release_api_path" --jq '.assets | length')"
          release_asset_names="$(gh api "$release_api_path" --jq '.assets[].name')"
          if [[ "$release_tag_name" != "$RELEASE_TAG" ]] || \
            [[ "$release_is_draft" != false ]] || \
            [[ "$release_is_prerelease" != false ]] || \
            [[ "$release_is_immutable" != true ]] || \
            [[ "$release_asset_count" != 2 ]] || \
            ! grep -Fxq "$release_package_name" <<<"$release_asset_names" || \
            ! grep -Fxq "$release_checksum_name" <<<"$release_asset_names"; then
            echo "Recovered GitHub Release ${RELEASE_TAG} failed exact state validation." >&2
            exit 1
          fi
          release_readback_directory="$RUNNER_TEMP/release-readback"
          mkdir -p "$release_readback_directory"
          gh release download "$RELEASE_TAG" \
            --dir "$release_readback_directory" \
            --pattern "$release_package_name" \
            --pattern "$release_checksum_name"
          (
            cd "$release_readback_directory"
            sha256sum --check "$release_checksum_name"
          )
          cmp -- "dist/${release_package_name}" "$release_readback_directory/${release_package_name}"
          cmp -- "dist/${release_checksum_name}" "$release_readback_directory/${release_checksum_name}"
