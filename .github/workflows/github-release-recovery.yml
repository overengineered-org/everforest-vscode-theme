name: GitHub Release recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild release assets
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Rebuild release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/package-release.mjs "${RELEASE_TAG#v}"
      - name: Verify package contents
        run: npm run package:verify
      - name: Preserve rebuilt assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: recovered-release-assets
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
          retention-days: 1

  publish:
    name: Repair GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download rebuilt assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recovered-release-assets
          path: dist
      - name: Create or repair release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_package_path="dist/${release_package_name}"
          release_checksum_path="dist/${release_checksum_name}"
          release_api_response="$(mktemp)"
          release_lookup_error="$(mktemp)"

          if gh api --include "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" >"$release_api_response" 2>"$release_lookup_error"; then
            release_exists=true
          elif grep -Eq '^HTTP/[0-9.]+ 404 ' "$release_api_response"; then
            release_exists=false
          else
            cat "$release_lookup_error" >&2
            exit 1
          fi

          if [[ "$release_exists" == false ]]; then
            gh release create "$RELEASE_TAG" \
              "$release_package_path" \
              "$release_checksum_path" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
            exit 0
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          package_exists=false
          checksum_exists=false
          grep -Fxq "$release_package_name" <<<"$existing_assets" && package_exists=true
          grep -Fxq "$release_checksum_name" <<<"$existing_assets" && checksum_exists=true

          if [[ "$package_exists" == true && "$checksum_exists" == true ]]; then
            rm -f "$release_package_path"
            gh release download "$RELEASE_TAG" --dir dist --pattern "$release_package_name"
            rm -f "$release_checksum_path"
            gh release download "$RELEASE_TAG" --dir dist --pattern "$release_checksum_name"
            if ! (cd dist && sha256sum --check "$release_checksum_name"); then
              echo "Replacing an invalid checksum with one generated from the published VSIX." >&2
              (cd dist && sha256sum "$release_package_name" >"$release_checksum_name")
              gh release delete-asset "$RELEASE_TAG" "$release_checksum_name" --yes
              gh release upload "$RELEASE_TAG" "$release_checksum_path"
            fi
            exit 0
          fi

          if [[ "$package_exists" == true ]]; then
            rm -f "$release_package_path"
            gh release download "$RELEASE_TAG" --dir dist --pattern "$release_package_name"
            (cd dist && sha256sum "$release_package_name" >"$release_checksum_name")
            gh release upload "$RELEASE_TAG" "$release_checksum_path"
            exit 0
          fi

          if [[ "$checksum_exists" == true ]]; then
            echo "Replacing an orphaned checksum because VSIX packages are not byte-reproducible." >&2
            gh release delete-asset "$RELEASE_TAG" "$release_checksum_name" --yes
          fi

          gh release upload "$RELEASE_TAG" "$release_package_path" "$release_checksum_path"
