name: GitHub Release recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Rebuild release assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/package-release.mjs "${RELEASE_TAG#v}"
      - name: Verify package contents
        run: npm run package:verify
      - name: Preserve rebuilt assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: recovered-release-assets
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
          retention-days: 1

  publish:
    name: Recover GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download rebuilt assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-release-assets
          path: dist
      - name: Create, publish draft, or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          release_package_name="everforest-complete-${release_version}.vsix"
          release_checksum_name="${release_package_name}.sha256"
          release_package_path="dist/${release_package_name}"
          release_checksum_path="dist/${release_checksum_name}"
          release_api_response="$(mktemp)"
          release_lookup_error="$(mktemp)"
          release_asset_directory="$(mktemp -d)"
          trap 'rm -f "$release_api_response" "$release_lookup_error"; rm -rf "$release_asset_directory"' EXIT

          if gh api --include "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" >"$release_api_response" 2>"$release_lookup_error"; then
            release_exists=true
          elif grep -Eq '^HTTP/[0-9.]+ 404 ' "$release_api_response"; then
            release_exists=false
          else
            cat "$release_lookup_error" >&2
            exit 1
          fi

          if [[ "$release_exists" == false ]]; then
            gh release create "$RELEASE_TAG" \
              "$release_package_path" \
              "$release_checksum_path" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --verify-tag
            exit 0
          fi

          release_is_draft="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --jq '.draft')"
          if [[ "$release_is_draft" == true ]]; then
            gh release upload "$RELEASE_TAG" \
              "$release_package_path" \
              "$release_checksum_path" \
              --clobber
            gh release download "$RELEASE_TAG" --dir "$release_asset_directory" --pattern "$release_package_name"
            gh release download "$RELEASE_TAG" --dir "$release_asset_directory" --pattern "$release_checksum_name"
            if ! (cd "$release_asset_directory" && sha256sum --check "$release_checksum_name"); then
              echo "Draft release $RELEASE_TAG has a corrupt checksum and was not published." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --draft=false
            exit 0
          fi

          if [[ "$release_is_draft" != false ]]; then
            echo "Could not determine whether release $RELEASE_TAG is immutable." >&2
            exit 1
          fi

          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if ! grep -Fxq "$release_package_name" <<<"$existing_assets" || \
            ! grep -Fxq "$release_checksum_name" <<<"$existing_assets"; then
            echo "Release $RELEASE_TAG is immutable and missing required assets; it cannot be repaired." >&2
            exit 1
          fi

          gh release download "$RELEASE_TAG" --dir "$release_asset_directory" --pattern "$release_package_name"
          gh release download "$RELEASE_TAG" --dir "$release_asset_directory" --pattern "$release_checksum_name"
          if ! (cd "$release_asset_directory" && sha256sum --check "$release_checksum_name"); then
            echo "Release $RELEASE_TAG is immutable and has a corrupt checksum; it cannot be repaired." >&2
            exit 1
          fi
